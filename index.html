<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>onlyfash</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0a0a0c" />
<meta name="description" content="SLOW DANCE — join the waitlist." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --mono:"JetBrains Mono", ui-monospace, monospace;
    --ink:#ebe7dc;
    --paper:#0a0a0c;
    --dim:#7a7670;
    --faint:#3a3731;
    --hot:#e96a4a;
    --slow-a:#2a0e36;
    --slow-b:#070309;
    --slow-hi:#b078d8;
    --slow-teal:#1a4a52;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;min-height:100%;
    background:#000;color:var(--ink);
    font-family:var(--mono);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  body{min-height:100vh;min-height:100dvh;overflow-x:hidden}

  .stage{
    position:relative;min-height:100vh;min-height:100dvh;
    background:var(--paper);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    overflow-x:hidden;overflow-y:auto;
    padding:
      max(72px, calc(env(safe-area-inset-top, 0px) + 56px))
      max(24px, env(safe-area-inset-right, 0px))
      max(72px, calc(env(safe-area-inset-bottom, 0px) + 56px))
      max(24px, env(safe-area-inset-left, 0px));
  }
  .stage::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
    background:
      radial-gradient(140% 100% at 50% 50%, transparent 40%, rgba(0,0,0,.55) 100%),
      radial-gradient(60% 40% at 50% 8%, rgba(80,60,40,.08), transparent 60%),
      radial-gradient(70% 50% at 50% 58%, rgba(42,14,54,.28), transparent 62%),
      radial-gradient(60% 40% at 50% 92%, rgba(26,74,82,.10), transparent 60%);
  }
  .grain{
    position:absolute;inset:-10%;z-index:30;pointer-events:none;mix-blend-mode:overlay;opacity:.25;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.9 0 0 0 0 0.9 0 0 0 0 0.9 0 0 0 0.7 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size:220px 220px;
    animation:grain 1690ms steps(6) infinite;
  }
  @keyframes grain{
    0%{transform:translate(0,0)}
    16%{transform:translate(-3%, 2%)}
    33%{transform:translate(2%, -3%)}
    50%{transform:translate(-2%, -2%)}
    66%{transform:translate(3%, 1%)}
    83%{transform:translate(-1%, 3%)}
    100%{transform:translate(0,0)}
  }

  .chrome{
    position:absolute;inset:0;z-index:20;pointer-events:none;
    font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);
  }
  .chr-tl{position:absolute;top:22px;left:24px}
  .blink{
    display:inline-block;width:7px;height:7px;background:var(--hot);border-radius:50%;
    vertical-align:middle;margin-right:8px;animation:pulseDot 2.2s infinite;
  }
  @keyframes pulseDot{0%,100%{opacity:.35}50%{opacity:1}}

  .stack{
    position:relative;z-index:10;
    width:min(100%, 22rem);
    margin-top:auto;margin-bottom:auto;
    display:flex;flex-direction:column;align-items:center;
    gap:clamp(28px, 6vh, 52px);
    text-align:center;
  }

  .portal-wrap{position:relative;isolation:isolate}
  .halo{
    position:absolute;inset:-22%;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, rgba(176,120,216,.35), rgba(26,74,82,.12) 55%, transparent 70%);
    filter:blur(22px);opacity:.7;
    transition:opacity .6s ease;
  }
  .stage.is-playing .halo{opacity:1}
  .portal{
    position:relative;
    width:clamp(200px, 58vw, 300px);
    aspect-ratio:1;border-radius:50%;
    overflow:hidden;
    cursor:pointer;
  }
  .surface{
    position:absolute;inset:0;border-radius:50%;
    background:
      radial-gradient(circle at 38% 30%, rgba(176,120,216,.22), transparent 42%),
      radial-gradient(circle at 62% 70%, rgba(26,74,82,.45), transparent 46%),
      radial-gradient(circle at 50% 50%, var(--slow-a), var(--slow-b) 72%);
    animation:breath 5.6s ease-in-out infinite;
  }
  .lens{
    position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 38% 30%, rgba(255,255,255,.18), transparent 40%);
    mix-blend-mode:screen;opacity:.7;
  }
  .edge{
    position:absolute;inset:0;border-radius:50%;pointer-events:none;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 0 0 1px rgba(0,0,0,.6) inset, 0 0 60px rgba(0,0,0,.6);
  }
  @keyframes breath{
    0%,100%{transform:scale(1);filter:saturate(1)}
    50%{transform:scale(1.035);filter:saturate(1.15)}
  }
  .label{
    margin-top:22px;
    font-weight:400;
    white-space:nowrap;
  }
  .label .name{
    display:block;
    font-size:clamp(13px, 3.6vw, 16px);
    letter-spacing:.28em;
    text-transform:lowercase;
    color:var(--ink);
  }
  .label .name .caret{
    display:inline-block;margin-left:2px;opacity:.65;
    animation:caret 1s steps(1) infinite;
  }
  @keyframes caret{0%,49%{opacity:.65}50%,100%{opacity:0}}

  /* Soundtrack control, centered on the orb so the title and form stay put. */
  .listen{
    position:absolute;left:50%;top:64%;transform:translate(-50%,-50%);z-index:3;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    min-height:44px;min-width:96px;padding:0 16px 0 14px;
    border-radius:980px;
    border:1px solid rgba(235,231,220,.28);
    background:rgba(7,3,9,.62);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    color:var(--slow-hi);
    font:inherit;font-size:11px;font-weight:400;
    letter-spacing:.22em;text-transform:uppercase;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .listen:hover{color:var(--ink);border-color:rgba(176,120,216,.75)}
  .listen:focus{outline:none}
  .listen:focus-visible{
    color:var(--ink);
    border-color:rgba(176,120,216,.85);
    box-shadow:0 0 0 1px rgba(176,120,216,.35);
  }
  .listen[aria-pressed="true"]{
    color:var(--ink);
    border-color:rgba(176,120,216,.7);
  }
  .listen-mark{display:inline-flex;width:11px;height:11px;align-items:center;justify-content:center;flex:0 0 auto}
  .listen-mark svg{display:block}
  .listen-word{margin-right:-0.22em}
  .listen .icon-pause{display:none}
  .listen[aria-pressed="true"] .icon-play{display:none}
  .listen[aria-pressed="true"] .icon-pause{display:block}
  .track{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }

  .cta-block{width:100%}
  form{margin:0;width:100%;position:relative}
  .flow{
    min-height:13rem;
    transition:opacity .28s ease;
  }
  .flow.is-fading{opacity:0;pointer-events:none}
  .meta{
    display:flex;align-items:center;justify-content:space-between;
    min-height:44px;
  }
  .step{
    margin:0;
    font-size:10px;letter-spacing:.28em;
    color:var(--dim);
  }
  .ask{
    display:block;
    margin:0 0 16px;
    font-size:clamp(14px, 3.8vw, 15px);
    font-weight:400;
    letter-spacing:.01em;
    line-height:1.45;
    color:var(--ink);
    text-wrap:balance;
  }
  .field{
    position:relative;
    display:flex;align-items:center;
    border:1px solid rgba(235,231,220,.22);
    border-radius:980px;
    overflow:hidden;
    background:rgba(7,3,9,.35);
    transition:border-color .2s ease, box-shadow .2s ease, border-radius .2s ease;
  }
  .field.is-tall{
    border-radius:22px;
    align-items:flex-end;
  }
  .field:focus-within{
    border-color:rgba(176,120,216,.7);
    box-shadow:0 0 0 1px rgba(176,120,216,.25);
  }
  .sr, .hp{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }
  input.cta, textarea.cta{
    appearance:none;-webkit-appearance:none;
    flex:1;width:100%;min-width:0;
    margin:0;border:0;background:transparent;
    color:var(--ink);
    font:inherit;font-size:16px;font-weight:400;
    letter-spacing:.04em;
    line-height:1.2;
    padding:12px 8px 12px 20px;
    min-height:48px;
    caret-color:var(--slow-hi);
    outline:none;
    text-align:left;
  }
  input.cta::placeholder{color:var(--dim);opacity:1;letter-spacing:.08em}
  textarea.cta{
    resize:none;
    overflow:hidden;
    min-height:48px;
    max-height:160px;
    padding-top:14px;
    padding-bottom:14px;
    line-height:1.45;
    white-space:pre-wrap;
    overflow-wrap:break-word;
  }
  button.go{
    display:inline-flex;align-items:center;justify-content:center;
    appearance:none;-webkit-appearance:none;
    flex:0 0 auto;
    margin:4px 4px 4px 0;
    border:0;border-radius:980px;
    background:transparent;
    color:var(--ink);
    font:inherit;font-size:11px;font-weight:400;
    letter-spacing:.22em;text-transform:uppercase;
    min-height:40px;padding:0 16px;
    cursor:pointer;
    color:var(--slow-hi);
  }
  button.go:hover{color:var(--ink)}
  button.go:disabled{opacity:.4;cursor:default}
  button.go[data-kind="next"]{
    letter-spacing:0;
    font-size:16px;
    line-height:1;
    padding:0 14px;
  }
  .back{
    appearance:none;-webkit-appearance:none;
    display:inline-flex;align-items:center;justify-content:center;
    margin:0 0 0 auto;padding:0 4px 0 12px;
    min-height:44px;
    border:0;background:transparent;
    color:var(--dim);
    font:inherit;font-size:10px;font-weight:400;
    letter-spacing:.18em;text-transform:lowercase;
    cursor:pointer;
    visibility:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  .back.is-on{visibility:visible}
  .back:hover{color:var(--ink)}
  .back:focus{outline:none}
  .back:focus-visible{
    color:var(--ink);
    border-radius:980px;
    box-shadow:0 0 0 1px rgba(176,120,216,.35);
  }
  .consent{
    margin:14px 0 0;
    font-size:10px;letter-spacing:.08em;line-height:1.5;
    color:var(--dim);
  }
  .err{
    margin:12px 0 0;
    font-size:11px;letter-spacing:.06em;line-height:1.5;
    color:var(--hot);
  }
  .err[hidden], .done[hidden], form[hidden], .ask[hidden], .consent[hidden], .step[hidden]{display:none !important}
  .done{
    margin:0;
    font-size:clamp(16px, 4vw, 20px);
    letter-spacing:.18em;
    text-transform:lowercase;
    color:var(--ink);
    min-height:48px;
    display:flex;align-items:center;justify-content:center;
  }
  .fallback{
    color:inherit;
    text-decoration:underline;
    text-underline-offset:3px;
  }

  @media (max-width:360px){
    .stage{
      padding-left:max(16px, env(safe-area-inset-left, 0px));
      padding-right:max(16px, env(safe-area-inset-right, 0px));
    }
    input.cta, textarea.cta{padding-left:14px;letter-spacing:.02em}
    button.go{padding:0 12px}
    .consent{letter-spacing:.02em}
  }

  @media (min-width:768px){
    .portal{width:clamp(220px, 28vmin, 320px)}
    input.cta, textarea.cta{font-size:13px;letter-spacing:.08em}
    .label .name{letter-spacing:.32em}
  }

  @media (prefers-reduced-motion:reduce){
    .grain, .surface, .blink, .caret, .halo, .flow, .field{animation:none;transition:none}
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="grain" aria-hidden="true"></div>
    <div class="chrome">
      <div class="chr-tl"><span class="blink" aria-hidden="true"></span>onlyfash</div>
    </div>

    <div class="stack">
      <div class="portal-wrap">
        <div class="halo" aria-hidden="true"></div>
        <div class="portal" id="portal">
          <div class="surface"></div>
          <div class="lens"></div>
          <div class="edge"></div>
          <button class="listen" id="listen" type="button" aria-pressed="false" aria-label="Play Slow Dance">
            <span class="listen-mark" aria-hidden="true">
              <svg class="icon-play" viewBox="0 0 10 12" width="9" height="11" focusable="false"><path d="M1 .6 9.2 6 1 11.4Z" fill="currentColor"/></svg>
              <svg class="icon-pause" viewBox="0 0 10 12" width="9" height="11" focusable="false"><path d="M.8.8h2.6v10.4H.8zM6.6.8h2.6v10.4H6.6z" fill="currentColor"/></svg>
            </span>
            <span class="listen-word">play</span>
          </button>
        </div>
        <div class="label">
          <span class="name">slow dance<span class="caret" aria-hidden="true">_</span></span>
        </div>
      </div>

      <div class="cta-block">
        <form id="waitform" novalidate>
          <div class="flow" id="flow">
            <div class="meta">
              <p class="step" id="stepmark" aria-label="Question 1 of 3">1/3</p>
              <button class="back" id="back" type="button">back</button>
            </div>
            <label class="ask" id="ask" for="answer">fash. what does it feel like to you?</label>
            <label class="sr" for="email">Email for the waitlist</label>
            <div class="field" id="field">
              <textarea class="cta" id="answer" name="answer" rows="1" maxlength="600" enterkeyhint="next" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required></textarea>
              <input class="cta" id="email" name="email" type="email" inputmode="email" autocomplete="email" enterkeyhint="go" autocapitalize="none" spellcheck="false" placeholder="Join the waitlist" hidden />
              <input class="hp" id="hp" name="company" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" />
              <button class="go" id="go" type="submit" data-kind="next" aria-label="Continue">→</button>
            </div>
            <p class="consent" id="consent" hidden>Only updates from FASH. Unsubscribe anytime.</p>
            <p class="err" id="err" role="alert" hidden></p>
          </div>
        </form>
        <p class="sr" id="live" aria-live="polite"></p>
        <p class="done" id="done" hidden>See you soon.</p>
      </div>
    </div>
  </div>

  <audio class="track" id="track" src="audio/slow-dance-master.mp3" preload="auto" loop playsinline webkit-playsinline></audio>

  <!--
    Three questions, then the email. The page posts JSON to same-origin
    /api/waitlist (api/waitlist.js), which forwards the email server-side
    to https://iwannafash.com/api/waitlist and then stores the answers.
  -->
  <script>
    (function () {
      var audio = document.getElementById('track');
      var listen = document.getElementById('listen');
      var portal = document.getElementById('portal');
      var stage = document.querySelector('.stage');
      var word = listen ? listen.querySelector('.listen-word') : null;
      if (!audio || !listen || !word) return;

      var held = false;
      var fadeId = 0;
      var epoch = 0;

      function paint(playing) {
        listen.setAttribute('aria-pressed', playing ? 'true' : 'false');
        listen.setAttribute('aria-label', playing ? 'Pause Slow Dance' : 'Play Slow Dance');
        word.textContent = playing ? 'pause' : 'play';
        if (stage) stage.classList.toggle('is-playing', !!playing);
      }

      function fade(from, to, ms, onDone) {
        var id = ++fadeId;
        var t0 = performance.now();
        function frame(now) {
          if (id !== fadeId) return;
          var p = ms <= 0 ? 1 : Math.min(1, (now - t0) / ms);
          var e = 1 - Math.pow(1 - p, 2);
          audio.volume = from + (to - from) * e;
          if (p < 1) requestAnimationFrame(frame);
          else if (onDone) onDone();
        }
        requestAnimationFrame(frame);
      }

      function start() {
        epoch += 1;
        held = false;
        audio.muted = false;
        ++fadeId;
        if (audio.paused) audio.volume = 0;
        var playPromise = audio.play();
        paint(true);
        function rise() {
          if (held || audio.paused) return;
          fade(audio.volume, 1, 900);
        }
        if (playPromise && playPromise.then) {
          playPromise.then(rise).catch(function () { paint(false); });
        } else {
          rise();
        }
        return playPromise;
      }

      function stop() {
        held = true;
        fade(audio.volume, 0, 280, function () {
          if (!held) return;
          try { audio.pause(); } catch (e) {}
          paint(false);
        });
      }

      function toggle() {
        if (audio.paused) start();
        else stop();
      }

      function primeMuted() {
        var token = epoch;
        audio.muted = true;
        var q = audio.play();
        function reset() {
          if (token !== epoch) return;
          try { audio.pause(); } catch (e) {}
          try { audio.currentTime = 0; } catch (e) {}
          audio.muted = false;
          audio.volume = 0;
          paint(false);
        }
        if (q && q.then) q.then(reset).catch(function () { audio.muted = false; audio.volume = 0; paint(false); });
        else reset();
      }

      listen.addEventListener('click', function (e) {
        e.stopPropagation();
        toggle();
      });
      if (portal) {
        portal.addEventListener('click', function (e) {
          if (e.target && e.target.closest && e.target.closest('#listen')) return;
          toggle();
        });
      }

      // Soundtrack: the first tap anywhere else starts the master. An explicit
      // pause stays paused. The play control is excluded so its own click can toggle.
      function arm(e) {
        if (e.button && e.button !== 0) return;
        var target = e.target;
        // The orb and its play control toggle on click. Starting on pointerdown
        // there would begin playback and the click would immediately pause it.
        if (target && target.closest && target.closest('#portal')) return;
        if (held || !audio.paused) return;
        start();
      }
      document.addEventListener('pointerdown', arm, { passive: true });

      audio.addEventListener('pause', function () { paint(false); });

      try {
        audio.volume = 0;
        var auto = audio.play();
        if (auto && auto.then) {
          auto.then(function () { paint(true); fade(0, 1, 1200); }).catch(primeMuted);
        }
      } catch (e) {}
    })();
  </script>
  <script>
    (function () {
      var WAITLIST_URL = '/api/waitlist';
      var QUESTIONS = [
        'fash. what does it feel like to you?',
        'what are you chasing that nobody knows about?',
        'who do you become when the lights go low?'
      ];
      var FADE_MS = 280;
      var MAX_ANSWER = 600;
      var DUPLICATE_RE = /duplicate|already|subscribed|on[-_ ]list|exists/i;

      var form = document.getElementById('waitform');
      var flow = document.getElementById('flow');
      var answer = document.getElementById('answer');
      var email = document.getElementById('email');
      var field = document.getElementById('field');
      var ask = document.getElementById('ask');
      var stepmark = document.getElementById('stepmark');
      var back = document.getElementById('back');
      var hp = document.getElementById('hp');
      var go = document.getElementById('go');
      var err = document.getElementById('err');
      var done = document.getElementById('done');
      var consent = document.getElementById('consent');
      var live = document.getElementById('live');
      if (!form || !flow || !answer || !email || !go || !done) return;

      var answers = ['', '', ''];
      var step = 0;
      var busy = false;
      var lock = false;
      var reduce = false;
      try {
        reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      } catch (e) {}
      var EMAIL_RE = /^[a-z0-9._%+\-]+@[a-z0-9.-]+\.[a-z]{2,}$/i;

      function activeField() {
        return step >= QUESTIONS.length ? email : answer;
      }
      function showError(msg, html) {
        if (!err) return;
        err.hidden = false;
        if (html) err.innerHTML = html;
        else err.textContent = msg;
        activeField().setAttribute('aria-invalid', 'true');
      }
      function hideError() {
        if (!err) return;
        err.hidden = true;
        err.textContent = '';
        answer.removeAttribute('aria-invalid');
        email.removeAttribute('aria-invalid');
      }
      function grow() {
        if (answer.hidden) return;
        answer.style.height = 'auto';
        var full = answer.scrollHeight;
        var next = Math.min(full, 160);
        answer.style.height = next + 'px';
        answer.style.overflow = full > 160 ? 'auto' : 'hidden';
        if (field) field.classList.toggle('is-tall', full > 72);
      }
      function render(opts) {
        var emailStep = step >= QUESTIONS.length;
        if (stepmark) {
          if (!emailStep) {
            stepmark.hidden = false;
            stepmark.textContent = (step + 1) + '/3';
            stepmark.setAttribute('aria-label', 'Question ' + (step + 1) + ' of 3');
          } else {
            stepmark.hidden = true;
          }
        }
        if (ask) {
          ask.hidden = emailStep;
          if (!emailStep) ask.textContent = QUESTIONS[step];
        }
        answer.hidden = emailStep;
        email.hidden = !emailStep;
        if (consent) consent.hidden = !emailStep;
        if (back) {
          var showBack = step > 0;
          back.classList.toggle('is-on', showBack);
          back.disabled = !showBack;
          back.tabIndex = showBack ? 0 : -1;
          back.setAttribute('aria-hidden', showBack ? 'false' : 'true');
        }
        if (!emailStep) {
          answer.value = answers[step] || '';
          answer.maxLength = MAX_ANSWER;
          go.setAttribute('data-kind', 'next');
          go.textContent = '\u2192';
          go.setAttribute('aria-label', 'Continue');
          grow();
          window.requestAnimationFrame(grow);
        } else {
          if (field) field.classList.remove('is-tall');
          go.setAttribute('data-kind', 'join');
          go.textContent = 'join';
          go.setAttribute('aria-label', 'Join the waitlist');
        }
        if (opts && opts.focus) {
          if (live) {
            live.textContent = emailStep
              ? 'Email for the waitlist'
              : 'Question ' + (step + 1) + ' of 3. ' + QUESTIONS[step];
          }
          try { activeField().focus(); } catch (e) {}
        }
      }
      function goTo(next) {
        if (lock) return;
        function apply() {
          step = next;
          render({ focus: true });
        }
        if (reduce) {
          apply();
          return;
        }
        lock = true;
        flow.classList.add('is-fading');
        window.setTimeout(function () {
          apply();
          void flow.offsetWidth;
          flow.classList.remove('is-fading');
          window.setTimeout(function () { lock = false; }, FADE_MS);
        }, FADE_MS);
      }
      function continueAnswer() {
        if (busy || lock || step >= QUESTIONS.length) return;
        var value = (answer.value || '').trim();
        if (!value) {
          showError('this one needs an answer.');
          try { answer.focus(); } catch (e) {}
          return;
        }
        if (value.length > MAX_ANSWER) value = value.slice(0, MAX_ANSWER);
        answers[step] = value;
        hideError();
        goTo(step + 1);
      }
      function unlock() {
        busy = false;
        answer.disabled = false;
        email.disabled = false;
        go.disabled = false;
        if (back) back.disabled = step === 0;
        form.removeAttribute('aria-busy');
      }
      function finish() {
        form.hidden = true;
        if (err) err.hidden = true;
        if (live) live.textContent = '';
        done.hidden = false;
        try { done.focus(); } catch (e) {}
      }
      function accepted(res, data) {
        if (res.ok && data && data.ok) return true;
        if (res.status === 409) return true;
        var blob = '';
        if (data) {
          ['status', 'error', 'message', 'code', 'reason'].forEach(function (key) {
            if (typeof data[key] === 'string') blob += ' ' + data[key];
          });
          if (data.duplicate === true || data.already === true || data.exists === true) return true;
        }
        return DUPLICATE_RE.test(blob);
      }

      answer.addEventListener('input', function () {
        if (answer.value.length > MAX_ANSWER) answer.value = answer.value.slice(0, MAX_ANSWER);
        grow();
      });
      answer.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
        e.preventDefault();
        if (typeof form.requestSubmit === 'function') form.requestSubmit();
        else continueAnswer();
      });
      if (back) {
        back.addEventListener('click', function () {
          if (busy || lock || step === 0) return;
          if (step < QUESTIONS.length) answers[step] = answer.value;
          hideError();
          goTo(step - 1);
        });
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (busy || lock) return;
        if (step < QUESTIONS.length) {
          continueAnswer();
          return;
        }
        var value = (email.value || '').trim();
        if (!value || value.length > 254 || !EMAIL_RE.test(value)) {
          showError("That email doesn't look right.");
          try { email.focus(); } catch (err2) {}
          return;
        }
        busy = true;
        hideError();
        answer.disabled = true;
        email.disabled = true;
        go.disabled = true;
        if (back) back.disabled = true;
        form.setAttribute('aria-busy', 'true');

        var body = {
          email: value,
          company: hp ? hp.value : '',
          answers: QUESTIONS.map(function (q, i) { return { q: q, a: answers[i] }; }),
          referrer: document.referrer || ''
        };

        fetch(WAITLIST_URL, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body)
        }).then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (data) {
            return { res: res, data: data };
          });
        }).then(function (out) {
          if (accepted(out.res, out.data)) {
            finish();
            return;
          }
          if (out.res.status === 429) showError('Please try again in a moment.');
          else if (out.res.status === 403) {
            showError('', 'The waitlist is open at <a class="fallback" href="https://iwannafash.com/">iwannafash.com</a>.');
          } else {
            showError('Something went wrong. Please try again.');
          }
          unlock();
        }).catch(function () {
          showError('', 'The waitlist is open at <a class="fallback" href="https://iwannafash.com/">iwannafash.com</a>.');
          unlock();
        });
      });

      render();
    })();
  </script>
</body>
</html>
